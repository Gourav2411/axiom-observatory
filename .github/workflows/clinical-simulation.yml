name: Clinical model simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/clinical-simulation.yml"
      - "scripts/campaign-worker.mjs"
      - "services/clinical_simulation.py"
      - "supabase/migrations/*clinical_simulation*"
  schedule:
    - cron: "29 * * * *"

concurrency:
  group: axiom-clinical-model-simulation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-slim
    outputs:
      has_jobs: ${{ steps.queue.outputs.has_jobs }}
    steps:
      - name: Check for queued clinical model jobs
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          count="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/jobs?status=eq.queued&job_type=in.(clinical_phase1_simulation,clinical_phase2_simulation)&select=id&limit=1" | jq 'length')"
          if [ "$count" -gt 0 ]; then echo "has_jobs=true" >> "$GITHUB_OUTPUT"; else echo "has_jobs=false" >> "$GITHUB_OUTPUT"; fi

  simulate:
    needs: detect
    if: needs.detect.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install application dependencies
        run: npm ci --omit=dev
      - name: Verify transparent simulation model
        run: python -m py_compile services/clinical_simulation.py
      - name: Run queued PK/PD research scenarios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AXIOM_ARTIFACT_SIGNING_KEY: ${{ secrets.AXIOM_ARTIFACT_SIGNING_KEY }}
          AXIOM_CAMPAIGN_JOB_TYPES: clinical_phase1_simulation,clinical_phase2_simulation
          AXIOM_CAMPAIGN_ONESHOT: "true"
          AXIOM_CAMPAIGN_MAX_JOBS: "20"
          AXIOM_PYTHON_BINARY: python
        run: |
          set -euo pipefail
          mkdir -p services/artifacts
          node scripts/campaign-worker.mjs
