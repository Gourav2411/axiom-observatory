services:
  - type: web
    name: axiom-observatory
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    domains:
      - axiom.yomexa.xyz
    envVars:
      - key: SUPABASE_URL
        value: https://wmctadhdehnlqzltffun.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://wmctadhdehnlqzltffun.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_GOOGLE_ENABLED
        value: "true"
      - key: AXIOM_ARTIFACT_SIGNING_KEY
        generateValue: true
      - key: AXIOM_CAMPAIGN_POLL_MS
        value: "2000"
      - key: AXIOM_CAMPAIGN_JOB_TYPES
        value: molecule_prep,docking_prepare,retrosynthesis_fragments,route_planning
      - key: AXIOM_HEAVY_COMPUTE_MODE
        value: github_actions
      - key: AXIOM_ADMET_EXECUTION_ENABLED
        value: "false"
      - key: GITHUB_ACTIONS_REPOSITORY
        value: Gourav2411/axiom-observatory
      - key: GITHUB_ACTIONS_REF
        value: main
    disk:
      name: axiom-compute-artifacts
      mountPath: /app/services/artifacts
      sizeGB: 10
