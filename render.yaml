services:
  - type: web
    name: axiom-observatory
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    domains:
      - axiom.yomexa.xyz
    envVars:
      - key: SUPABASE_URL
        value: https://wmctadhdehnlqzltffun.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://wmctadhdehnlqzltffun.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_GOOGLE_ENABLED
        value: "true"
      - key: AXIOM_ARTIFACT_SIGNING_KEY
        generateValue: true
      - key: AXIOM_CAMPAIGN_POLL_MS
        value: "2000"
      # ADMET-AI imports a PyTorch model stack that exceeds the Starter
      # instance's 512 MB limit. Keep the web/RDKit/docking-prep service stable
      # until ADMET is moved to a separately sized worker.
      - key: AXIOM_ADMET_EXECUTION_ENABLED
        value: "false"
    disk:
      name: axiom-compute-artifacts
      mountPath: /app/services/artifacts
      sizeGB: 10
